<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyList - Кошик покупок</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>

    <div class="container">
        <main class="left-panel">
            <div class="add-row">
                <input type="text" id="new-item-input" placeholder="Назва товару" aria-label="Введіть назву нового товару">
                <button class="btn-add" id="btn-add-item" data-tooltip="Додати товар до списку">Додати</button>
            </div>

            <ul class="item-list" id="item-list"></ul>
        </main>

        <aside class="right-panel">
            <section class="summary-card">
                <h2>Залишилося</h2>
                <div class="tags-container" id="stats-left"></div>
            </section>

            <section class="summary-card">
                <h2>Куплено</h2>
                <div class="tags-container" id="stats-bought"></div>
            </section>
        </aside>
    </div>

    <div class="author-badge">
        <span class="badge-title">BuyList</span>
        <span class="badge-name">Твоє Ім'я та Прізвище</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
